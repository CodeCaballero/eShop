name: Publish container images

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Aspire CLI
        run: |
          dotnet tool install -g aspire.cli --version 13.2.0
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push images
        env:
          REGISTRY_ENDPOINT: ghcr.io
          ASPIRE_CONTAINER_RUNTIME: docker
        run: |
          export REGISTRY_REPOSITORY=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          aspire do push \
            --apphost src/eShop.AppHost/eShop.AppHost.csproj \
            --non-interactive \
            --nologo

      - name: Publish Docker Compose artifacts
        run: |
          aspire publish \
            --apphost src/eShop.AppHost/eShop.AppHost.csproj \
            -o ./aspire-output \
            --non-interactive \
            --nologo

      - name: Write .env from template
        working-directory: aspire-output
        run: |
          export REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          export TAG=$(docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep "ghcr.io/${REPO}/webapp:" \
            | head -1 \
            | cut -d: -f2)
          echo "Using REPO=$REPO TAG=$TAG"
          test -n "$TAG"

          # Only substitute non-secret placeholders (never passwords)
          envsubst '${REPO} ${TAG}' < ../deploy/env.template > .env

          # Sanity check without dumping secrets (passwords stay empty)
          grep -E '^(IDENTITY_API_IMAGE|WEBAPP_IMAGE)=' .env

      - name: Upload compose artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aspire-output
          path: aspire-output/
          include-hidden-files: true
          retention-days: 7
